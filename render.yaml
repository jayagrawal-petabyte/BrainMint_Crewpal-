services:
  # NestJS Backend Web Service
  - type: web
    name: crewpal-backend
    env: node
    region: singapore # or oregon, frankfurt, etc.
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:init && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: crewpal-db
          property: internalConnectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN # Update this to your frontend Render URL after deploying frontend
        value: "https://brainmintcrewpal.vercel.app"

databases:
  - name: crewpal-db
    databaseName: crewpal
    user: crewpal_user
    plan: free
