services:
  # NestJS Backend Web Service
  - type: web
    name: crewpal-backend
    env: node
    region: singapore # or oregon, frankfurt, etc.
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:init && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: crewpal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN
        value: "https://brain-mint-crewpal.vercel.app,https://brainmintcrewpal.vercel.app"
      - key: ALLOWED_EMAIL_DOMAINS
        value: "crewpal.com,srmist.edu.in"

databases:
  - name: crewpal-db
    databaseName: crewpal
    user: crewpal_user
    plan: free
